# Render Blueprint: AI Recipe Maker
# Deploy from repo root: Backend (Node), Static site (Vite), and Postgres.
# After first deploy, set FRONTEND_URL and VITE_API_URL in the dashboard (see DEPLOY.md).

databases:
  - name: ai-recipe-db
    plan: free
    databaseName: ai_recipe_maker

services:
  # Backend API (Node)
  - type: web
    name: ai-recipe-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-recipe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Frontend (Vite static site)
  - type: web
    name: ai-recipe-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
